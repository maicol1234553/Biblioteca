spring.application.name=notificacion
server.port=${PORT:8084}

# Misma base de datos Neon que auth, catalogo y prestamos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SMTP configurado por variables de entorno. Sin credenciales reales,
# los envios quedan registrados como fallidos y pueden reintentarse.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# SMTP no debe tumbar el health del microservicio: los fallos de correo se
# registran en historial_envio y se reintentan.
management.health.mail.enabled=false

notificaciones.remitente=${MAIL_FROM:no-reply@biblioteca.local}
notificaciones.reintentos.maximos=3
notificaciones.reintentos.espera-ms=2000
notificaciones.job.intervalo-ms=60000
notificaciones.job.initial-delay-ms=30000
notificaciones.recordatorio.dias-anticipacion=1
notificaciones.servicios.auth-url=${AUTH_URL:http://localhost:8081}
notificaciones.servicios.timeout-segundos=5
# SMS (Brevo). Sin BREVO_API_KEY el envio queda FALLIDA y es reintentable.
notificaciones.sms.api-key=${BREVO_API_KEY:}
notificaciones.sms.sender=${SMS_SENDER:Biblioteca}
notificaciones.sms.codigo-pais=${SMS_PAIS:57}
notificaciones.sms.timeout-segundos=10
# Canal usado por los eventos que no piden uno explicito (SMS o CORREO).
notificaciones.canal=${NOTIFICACION_CANAL:SMS}
