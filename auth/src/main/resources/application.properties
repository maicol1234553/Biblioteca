spring.application.name=auth
server.port=${PORT:8081}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

auth.servicios.notificacion-url=${NOTIFICACION_URL:http://localhost:8084}
auth.servicios.internal-api-key=${INTERNAL_API_KEY:}
auth.servicios.connect-timeout-segundos=${CONNECT_TIMEOUT_SECONDS:10}
auth.servicios.read-timeout-segundos=${READ_TIMEOUT_SECONDS:90}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
