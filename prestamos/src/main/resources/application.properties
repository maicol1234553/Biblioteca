spring.application.name=prestamos
server.port=${PORT:8083}

# Misma base de datos Neon que auth y catalogo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Politica de negocio centralizada.
prestamos.limite-prestamos-activos=3
prestamos.dias-prestamo=15
prestamos.dias-reserva=3
prestamos.max-renovaciones=2
prestamos.multa-por-dia=2000.00

# Microservicios con los que se integra.
prestamos.servicios.auth-url=${AUTH_URL:http://localhost:8081}
prestamos.servicios.catalogo-url=${CATALOGO_URL:http://localhost:8082}
prestamos.servicios.notificacion-url=${NOTIFICACION_URL:http://localhost:8084}
prestamos.servicios.catalogo-admin-usuario-id=${CATALOGO_ADMIN_USUARIO_ID:8e03853d-7058-40a4-9692-2b5fbf82d47e}
prestamos.servicios.notificacion-habilitada=true
prestamos.servicios.notificacion-path=/api/notificaciones/evento
prestamos.servicios.timeout-segundos=5

# Procesamiento periodico de prestamos vencidos y reservas expiradas.
prestamos.job.intervalo-ms=3600000
