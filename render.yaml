# Blueprint de Render para el Sistema de Biblioteca.
# Crea 4 Web Services (Docker, plan free) que comparten la misma base Neon.
#
# Rutas explicitas: cada servicio usa SOLO su carpeta como contexto y su
# propio Dockerfile. No hay proyecto Maven padre; cada modulo es independiente.
#
# Los secretos viven en el Environment Group "biblioteca-config" y se piden
# una sola vez al aplicar el Blueprint (sync: false).

envVarGroups:
  - name: biblioteca-config
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: CATALOGO_ADMIN_USUARIO_ID
        value: 8e03853d-7058-40a4-9692-2b5fbf82d47e
      # Correo: configura al menos una de estas dos API keys. Render Free
      # bloquea los puertos SMTP, por lo que SMTP no funciona en plan free.
      - key: SENDGRID_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # SMTP solo se usa si no hay SENDGRID_API_KEY ni BREVO_API_KEY.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"

services:
  - type: web
    name: biblioteca-auth-maicol
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./auth/Dockerfile
    dockerContext: ./auth
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: biblioteca-config
      - key: MODULE
        value: auth
      # URL publica del servicio de notificacion (se configura tras el primer
      # despliegue). Ejemplo: https://biblioteca-notificacion-maicol.onrender.com
      - key: NOTIFICACION_URL
        sync: false
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k
      - key: SPRING_JPA_SHOW_SQL
        value: "false"

  - type: web
    name: biblioteca-catalogo-maicol
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./catalogo/Dockerfile
    dockerContext: ./catalogo
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: biblioteca-config
      - key: MODULE
        value: catalogo
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k
      - key: SPRING_JPA_SHOW_SQL
        value: "false"

  - type: web
    name: biblioteca-notificacion-maicol
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./notificacion/Dockerfile
    dockerContext: ./notificacion
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: biblioteca-config
      - key: MODULE
        value: notificacion
      # URL publica del servicio auth para resolver correos por idUsuario.
      - key: AUTH_URL
        sync: false
      # AUTH_URL se configura DESPUES del primer despliegue con la URL real
      # del servicio auth en Render (no se inventa aqui).
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k
      - key: SPRING_JPA_SHOW_SQL
        value: "false"

  - type: web
    name: biblioteca-prestamos-maicol
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./prestamos/Dockerfile
    dockerContext: ./prestamos
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: biblioteca-config
      - key: MODULE
        value: prestamos
      # AUTH_URL, CATALOGO_URL y NOTIFICACION_URL se configuran DESPUES del
      # primer despliegue con las URLs reales de Render (no se inventan aqui).
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
