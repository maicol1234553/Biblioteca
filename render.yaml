envVarGroups:
  - name: biblioteca-config
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: CATALOGO_ADMIN_USUARIO_ID
        value: 8e03853d-7058-40a4-9692-2b5fbf82d47e
      - key: SENDGRID_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
services:
  - type: web
    name: biblioteca-auth-maicol
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./auth/Dockerfile
    dockerContext: ./auth
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: biblioteca-config
      - key: MODULE
        value: auth
      - key: NOTIFICACION_URL
        sync: false
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
  - type: web
    name: biblioteca-catalogo-maicol
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./catalogo/Dockerfile
    dockerContext: ./catalogo
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: biblioteca-config
      - key: MODULE
        value: catalogo
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
  - type: web
    name: biblioteca-notificacion-maicol
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./notificacion/Dockerfile
    dockerContext: ./notificacion
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: biblioteca-config
      - key: MODULE
        value: notificacion
      - key: AUTH_URL
        sync: false
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
  - type: web
    name: biblioteca-prestamos-maicol
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./prestamos/Dockerfile
    dockerContext: ./prestamos
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: biblioteca-config
      - key: MODULE
        value: prestamos
      - key: AUTH_URL
        sync: false
      - key: CATALOGO_URL
        sync: false
      - key: NOTIFICACION_URL
        sync: false
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
